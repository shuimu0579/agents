# agents-ci — regression net for the Claude Code agent fleet (grill F5)
name: agents-ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Clean checkout invariant
        run: test -z "$(git status --porcelain)"

      - name: Hook executable + direct invocation
        run: |
          test -x hooks/restrict-bash-by-agent.sh
          test -x hooks/restrict-mutator-write.sh
          hooks/restrict-bash-by-agent.sh </dev/null
          hooks/restrict-mutator-write.sh </dev/null

      - name: All test suites
        run: bash tests/run_all.sh
