# agents-ci — regression net for the Claude Code agent fleet (grill F5)
name: agents-ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clean checkout invariant
        run: test -z "$(git status --porcelain)"

      - name: Guardrails (contract + tools + Verdict, strict)
        run: bash tests/guardrails.sh --strict

      - name: Hook executable + direct invocation
        run: |
          test -x hooks/restrict-bash-by-agent.sh
          hooks/restrict-bash-by-agent.sh </dev/null

      - name: Hooks (bash gate + approvals + prod guard)
        run: HOOK_SRC="$GITHUB_WORKSPACE/hooks/restrict-bash-by-agent.sh" SETTINGS="$GITHUB_WORKSPACE/tests/fixtures/settings.json" bash tests/hooks.test.sh
