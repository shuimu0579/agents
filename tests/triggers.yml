# tests/triggers.yml — single source of truth for agent trigger fixtures (grill F33)
# Used by humans and by tests/guardrails.sh (optional sanity). Not loaded by Claude Code runtime.
#
# Fields:
#   agent: filename stem under ~/.claude/agents/
#   positive: sample user utterances that SHOULD dispatch this agent
#   negative: sample utterances that should NOT (or should go elsewhere)
#   arbitrates_to: when ambiguous, which agent wins per rules/agents.md

agents:
  - agent: architect
    positive:
      - "Design how we should support multi-tenant workspaces"
      - "Should we use event sourcing or CRUD for the order pipeline?"
    negative:
      - "Break this into implementation steps" # main session / Plan Mode
    arbitrates_to: "structural design/decide → architect"

  - agent: code-reviewer
    positive:
      - "I just rewrote the auth middleware — review the changes"
      - "Does this payment service change look ok?"
    negative:
      - "Still writing the RED test for login" # wait until implementation settles
    arbitrates_to: "after implementation settles, before commit"

  - agent: security-reviewer
    positive:
      - "I added a new /login endpoint with JWT"
      - "Scan the upload API for SSRF and path traversal"
    negative:
      - "Rename a pure CSS variable" # no security surface
    arbitrates_to: "auth/secrets/input/API; parallel with code-reviewer"

  - agent: e2e-runner
    positive:
      - "Add E2E tests for checkout happy path with Playwright"
      - "The login E2E is flaky in CI"
    negative:
      - "Unit test the pure total calculator" # main session unit testing
    arbitrates_to: "critical user journeys"
